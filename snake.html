<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
}
.game-wrapper {
  background: #16213e;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 0 40px rgba(0,0,0,.5);
  text-align: center;
}
canvas {
  border: 2px solid #0f3460;
  border-radius: 8px;
  display: block;
  background: #0f3460;
}
.info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
  color: #e94560;
  font-size: 18px;
  font-weight: bold;
}
.score { color: #fff; }
button {
  background: #e94560;
  border: none;
  color: #fff;
  padding: 8px 24px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}
button:hover { background: #c23152; transform: scale(1.05); }
</style>
</head>
<body>
<div class="game-wrapper">
  <canvas id="game" width="400" height="400"></canvas>
  <div class="info">
    <span>分数: <span class="score" id="score">0</span></span>
    <button id="restart">重新开始</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const SIZE = 20;
const COLS = 20;
const ROWS = 20;

let snake = [{x: 10, y: 10}];
let dir = {x: 1, y: 0};
let nextDir = {x: 1, y: 0};
let food = {x: 15, y: 10};
let score = 0;
let running = false;
let gameLoop = null;

function randomFood() {
  const free = [];
  for (let i = 0; i < COLS; i++) {
    for (let j = 0; j < ROWS; j++) {
      if (!snake.some(s => s.x === i && s.y === j)) free.push({x: i, y: j});
    }
  }
  if (free.length === 0) return null;
  return free[Math.floor(Math.random() * free.length)];
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#e94560';
  ctx.fillRect(food.x * SIZE, food.y * SIZE, SIZE, SIZE);

  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#4ecca3' : '#36b37e';
    ctx.fillRect(seg.x * SIZE, seg.y * SIZE, SIZE - 1, SIZE - 1);
  });
}

function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    gameOver(); return;
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver(); return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    const f = randomFood();
    if (!f) { win(); return; }
    food = f;
  } else {
    snake.pop();
  }
  draw();
}

function gameOver() {
  stop();
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('游戏结束', 200, 180);
  ctx.font = '18px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('按"重新开始"继续', 200, 230);
}

function win() {
  stop();
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#4ecca3';
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('恭喜通关!', 200, 180);
}

function stop() {
  running = false;
  if (gameLoop) { clearInterval(gameLoop); gameLoop = null; }
}

function start() {
  if (gameLoop) clearInterval(gameLoop);
  running = true;
  gameLoop = setInterval(step, 150);
}

function reset() {
  stop();
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  scoreEl.textContent = '0';
  const f = randomFood();
  if (f) food = f;
  draw();
  start();
}

document.addEventListener('keydown', e => {
  if (!running) return;
  const key = e.key;
  if ((key === 'ArrowUp' || key === 'w' || key === 'W') && dir.y !== 1) nextDir = {x: 0, y: -1};
  if ((key === 'ArrowDown' || key === 's' || key === 'S') && dir.y !== -1) nextDir = {x: 0, y: 1};
  if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && dir.x !== 1) nextDir = {x: -1, y: 0};
  if ((key === 'ArrowRight' || key === 'd' || key === 'D') && dir.x !== -1) nextDir = {x: 1, y: 0};
});

document.getElementById('restart').addEventListener('click', reset);

reset();
</script>
</body>
</html>
